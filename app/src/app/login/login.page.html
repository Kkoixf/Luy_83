<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Login</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Login</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-card>
    <ion-card-header>
      <ion-card-title>Entrar no Sistema</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <form (ngSubmit)="login()">
        <ion-item>
          <ion-label position="floating">Username</ion-label>
          <ion-input [(ngModel)]="username" name="username" required autocapitalize="off"></ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="floating">Senha</ion-label>
          <ion-input [(ngModel)]="password" name="password" type="password" required></ion-input>
        </ion-item>

        <ion-button expand="block" type="submit" [disabled]="!username || !password">
          Entrar
        </ion-button>

        <ion-button expand="block" fill="clear" size="small" (click)="irParaRecuperarSenha()">
          Esqueci minha senha
        </ion-button>
      </form>

      <div class="ion-margin-vertical" style="text-align: center;">
        <p>Ou entre com</p>
      </div>

      <ion-button expand="block" color="danger" fill="outline" (click)="loginComGoogle()">
        <ion-icon slot="start" name="logo-google"></ion-icon>
        Entrar com Google
      </ion-button>

      <ion-button expand="block" fill="outline" (click)="irParaCadastro()" class="ion-margin-top">
        Cadastre-se
      </ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
