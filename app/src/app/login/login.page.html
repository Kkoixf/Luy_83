<ion-content class="auth-wrapper">
  <div class="container-central">
    <ion-card class="login-card">
      <ion-card-content>
        <div class="brand-section">
          <ion-img class="logo" src="../../assets/icon/logo.png" alt="Logo-Luy-83"></ion-img>
          <h1 class="brand-name">Luy83</h1>
        </div>

        <form (ngSubmit)="login()">
          <div class="input-container">
            <ion-label class="custom-label">E-mail</ion-label>
            <div class="custom-input-box">
              <ion-input [(ngModel)]="email" name="email" type="email" required autocapitalize="off"></ion-input>
            </div>
          </div>

          <div class="input-container">
            <ion-label class="custom-label">Senha</ion-label>
            <div class="custom-input-box">
              <ion-input [(ngModel)]="password" name="password" type="password" required></ion-input>
            </div>
          </div>

          <ion-button type="button" expand="block" fill="clear" size="small" (click)="irParaRecuperarSenha()">
            Esqueci minha senha
          </ion-button>

          <ion-button expand="block" type="submit" class="btn-primary-blue" [disabled]="!email || !password || processandoLogin">
            {{ processandoLogin ? 'ENTRANDO...' : 'ENTRAR' }}
          </ion-button>
        </form>

        <div class="google-login-section"
             [class.disabled]="processandoLogin"
             (click)="!processandoLogin && loginComGoogle()">
          <ion-icon name="logo-google" class="google-icon"></ion-icon>
          <ion-label>{{ processandoLogin ? 'Aguarde...' : 'Entrar com o Google' }}</ion-label>
        </div>

        <div class="footer-links">
          <p>
            Não tem uma conta?
            <span class="link-text" (click)="irParaCadastro()">Cadastre-se</span>
          </p>
        </div>

      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
